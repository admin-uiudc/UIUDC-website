<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In | UIU Debate Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2937;--orange:#ff7a00;--line:#e5e7eb;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;gap:12px}
.logo img{height:84px;width:auto;display:block}
.card{width:100%;max-width:320px;border:1px solid #6b7280;border-radius:8px;padding:24px}
label{display:block;font-size:16px;margin-bottom:12px}
input{width:100%;height:40px;border:2px solid var(--line);border-radius:10px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);margin-bottom:24px;background:#fff}
input::placeholder{color:#b8bcc4}
input:focus{outline:none;border-color:var(--orange)}
button{width:100%;height:40px;background:var(--orange);color:#fff;border:1px solid #1d1d1d;border-radius:6px;font:inherit;font-size:16px;cursor:pointer;margin-bottom:24px}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.6;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.forgot{color:var(--ink);font-size:16px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.forgot:hover{color:var(--orange)}
.err{display:none;color:#b42318;font-size:14px;margin:-12px 0 16px;line-height:1.4}
.info{display:none;color:#1f2937;background:#fff7ed;border:1px solid #fdba74;border-radius:8px;padding:10px 12px;font-size:13px;margin:-8px 0 16px;line-height:1.45}
</style>
</head>

<form class="card" id="f" novalidate>
  <label for="email">Email</label>
  <input id="email" type="email" placeholder="Insert your institutional email" autocomplete="username" required>
  <label for="pw">Password</label>
  <input id="pw" type="password" placeholder="Insert Password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert"></div>
  <div class="info" id="info" role="status"></div>
  <button type="submit" id="submitBtn">Sign In</button>
  <a class="forgot" href="#" id="forgotLink">Forgot password?</a>
</form>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWsBJ1Hi9cqE2RMtmEF_NHQvjJktFiii4",
    authDomain: "uiudc-website.firebaseapp.com",
    projectId: "uiudc-website",
    storageBucket: "uiudc-website.firebasestorage.app",
    messagingSenderId: "680858269973",
    appId: "1:680858269973:web:bc39098d2c9674fd6f911c",
    measurementId: "G-S3WJ16QZY7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const form = document.getElementById('f');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('pw');
  const btn = document.getElementById('submitBtn');
  const errEl = document.getElementById('err');
  const infoEl = document.getElementById('info');
  const forgotLink = document.getElementById('forgotLink');

  function showErr(msg) {
    infoEl.style.display = 'none';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }

  function showInfo(msg) {
    errEl.style.display = 'none';
    infoEl.textContent = msg;
    infoEl.style.display = 'block';
  }

  forgotLink.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    if (!email) {
      showErr('Enter your email above first, then click "Forgot password?".');
      emailInput.focus();
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email);
      showInfo('Password reset link sent! Check your inbox and spam folder.');
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showErr(`${err.code}: ${err.message}`);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errEl.style.display = 'none';
    infoEl.style.display = 'none';

    const email = emailInput.value.trim();
    const pw = pwInput.value;

    if (!email || !pw) {
      showErr('Please enter your email and password.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing In...';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, pw);
      const user = cred.user;
      const tokenResult = await user.getIdTokenResult(true);

      // 1. Admin users go straight to admin.html
      if (tokenResult.claims.admin === true) {
        window.location.href = 'admin.html';
        return;
      }

      // 2. Check Firestore user state for onboarding step or portal approval
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists()) {
        window.location.href = 'eauth.html';
        return;
      }

      const data = snap.data();
      if (data.role === 'admin') {
        window.location.href = 'admin.html';
        return;
      }

      if (data.portalAccess === true || tokenResult.claims.approved === true) {
        // Update 'portal.html' below if your member portal uses a different filename
        window.location.href = 'portal.html';
        return;
      }

      if (data.onboardingStep === 2) {
        window.location.href = 'eauth.html';
      } else if (data.onboardingStep === 3) {
        window.location.href = 'info_form.html';
      } else if (data.onboardingStep === 4) {
        window.location.href = 'payment.html';
      } else if (data.onboardingStep === 'completed') {
        showInfo('Your payment has been submitted and is awaiting admin verification. You will receive an email once portal access is granted.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      } else {
        window.location.href = 'eauth.html';
      }
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Sign In';
      showErr(`${err.code}: ${err.message}`);
    }
  });
</script>
