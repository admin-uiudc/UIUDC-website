<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign Up | UIU Debate Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{--orange:#f0801f;--orange-soft:#f6b57c;--red:#ff3b30;--ink:#1f2937;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:var(--ink);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;position:relative;overflow-x:hidden}
header,main{position:relative;z-index:1}
.top{max-width:1280px;margin:0 auto;padding:32px 40px 0;display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
.banner{position:relative;margin-top:2px}
.banner .title{background:linear-gradient(90deg,#ff3b30 0%,#ff6a3d 55%,#ff9550 100%);border:2px solid #111;border-radius:14px;padding:22px 36px 62px;text-align:right;color:#fff;font-weight:700;font-size:clamp(28px,3.6vw,48px);letter-spacing:.06em;line-height:1.1}
.banner .sub{position:absolute;right:0;bottom:-30px;width:calc(100% - 48px);background:#000;color:#fff;border-radius:14px;padding:14px 36px;text-align:right;font-size:clamp(18px,2.4vw,32px);font-weight:400;letter-spacing:.02em}
main{max-width:560px;margin:0 auto;padding:96px 24px 80px}
.field{margin-bottom:6px}
label{display:block;color:var(--orange);font-weight:700;font-size:18px;margin:0 0 8px 28px}
input[type=text],input[type=email],input[type=password]{display:block;width:100%;height:60px;border:2px solid var(--orange);border-radius:999px;background:rgba(238,238,238,.92);padding:0 28px;font:500 17px Montserrat,sans-serif;color:var(--ink);text-align:center;transition:box-shadow .15s}
input::placeholder{color:var(--orange-soft);font-weight:400}
input:focus{outline:none;box-shadow:0 0 0 4px rgba(240,128,31,.25)}
input[aria-invalid="true"]{border-color:#c62828}
#otp{letter-spacing:.5em;font-size:26px;font-weight:700;text-indent:.5em}
.err{min-height:22px;margin:4px 0 6px 28px;color:#c62828;font-size:13px;font-weight:500}
.captcha{display:flex;justify-content:center;margin:10px 0 0}
.confirm{display:block;width:100%;height:60px;margin-top:14px;border:0;border-radius:999px;background:var(--orange);color:#fff;font:700 26px Montserrat,sans-serif;letter-spacing:.03em;cursor:pointer;transition:filter .15s}
.confirm:hover{filter:brightness(.94)}
.confirm:disabled{opacity:.55;cursor:not-allowed}
.confirm:focus-visible,a:focus-visible,.link:focus-visible{outline:3px solid #111;outline-offset:3px}
.hint{text-align:center;margin:0 0 18px;color:var(--ink);font-size:15px;font-weight:500}
.hint b{color:var(--orange)}
.row{display:flex;justify-content:center;gap:22px;margin-top:12px;flex-wrap:wrap}
.link{background:none;border:0;padding:4px;font:600 15px Montserrat,sans-serif;color:var(--orange);cursor:pointer;text-decoration:underline}
.link:disabled{color:#aaa;text-decoration:none;cursor:not-allowed}
.already{text-align:center;margin:18px 0 0;color:var(--orange);font-size:17px}
.already a{font-weight:700;color:var(--orange)}
.already a:hover{text-decoration:underline}
.status{min-height:22px;margin-top:12px;text-align:center;font-weight:600;font-size:14px;color:#c62828}
.status.ok{color:#1b7a3a}
.hidden{display:none}
@media(max-width:820px){
  .top{padding:20px 20px 0;gap:16px}
  .banner .title{padding:18px 22px 54px}
  .banner .sub{width:calc(100% - 28px);padding:12px 22px;bottom:-26px}
  main{padding-top:72px}
}
</style>
</head>
<body>
<header class="top">
  <div class="banner">
    <div class="title">SIGN UP FORM</div>
    <div class="sub" id="sub">LOG IN INFORMATION</div>
  </div>
</header>

<main>
  <!-- STEP 1: details + captcha -->
  <form id="step1" novalidate>
    <div class="field"><label for="e">Email</label><input id="e" type="email" placeholder="Enter Your Institutional Email" autocomplete="email" required><div class="err" id="ee"></div></div>
    <div class="field"><label for="p">Password</label><input id="p" type="password" placeholder="Enter Your Password" autocomplete="new-password" required><div class="err" id="ep"></div></div>
    <div class="field"><label for="c">Confirm Password</label><input id="c" type="password" placeholder="Re-enter Your Password" autocomplete="new-password" required><div class="err" id="ec"></div></div>
    <div class="captcha"><div class="cf-turnstile" data-sitekey="YOUR_TURNSTILE_SITE_KEY"></div></div>
    <div class="err" id="ecap" style="text-align:center;margin-left:0"></div>
    <button class="confirm" id="sendBtn" type="submit">SEND CODE</button>
  </form>

  <!-- STEP 2: OTP -->
  <form id="step2" class="hidden" novalidate>
    <p class="hint">We sent a 6-digit code to <b id="sentTo"></b>.<br>It expires in 10 minutes.</p>
    <div class="field"><label for="otp">Verification Code</label><input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code" required><div class="err" id="eo"></div></div>
    <button class="confirm" id="verifyBtn" type="submit">CONFIRM</button>
    <div class="row">
      <button type="button" class="link" id="resend" disabled>Resend code</button>
      <button type="button" class="link" id="back">Change email</button>
    </div>
  </form>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <p class="already">Already Registered? <a href="login.html">Login</a></p>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

  // Paste your Firebase web config (Project settings → Your apps). Public by design.
  const app = initializeApp({
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
  });
  const auth = getAuth(app);
  const REDIRECT = "index.html"; // where to go after signup

  const $ = (id) => document.getElementById(id);
  const setErr = (inp, errEl, msg) => {
    errEl.textContent = msg || "";
    if (inp) inp.setAttribute("aria-invalid", msg ? "true" : "false");
    return !msg;
  };
  const status = (t, ok) => { $("status").textContent = t || ""; $("status").className = "status" + (ok ? " ok" : ""); };

  async function post(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || "Something went wrong. Please try again.");
    return data;
  }

  let cooldownTimer;
  function startCooldown(sec = 60) {
    clearInterval(cooldownTimer);
    const btn = $("resend");
    let left = sec;
    btn.disabled = true;
    btn.textContent = `Resend code (${left}s)`;
    cooldownTimer = setInterval(() => {
      left--;
      if (left <= 0) { clearInterval(cooldownTimer); btn.disabled = false; btn.textContent = "Resend code"; }
      else btn.textContent = `Resend code (${left}s)`;
    }, 1000);
  }

  function showStep(n) {
    $("step1").classList.toggle("hidden", n !== 1);
    $("step2").classList.toggle("hidden", n !== 2);
    $("sub").textContent = n === 1 ? "LOG IN INFORMATION" : "VERIFY YOUR EMAIL";
    status("");
  }

  async function sendCode() {
    const email = $("e").value.trim().toLowerCase();
    const token = document.querySelector('[name="cf-turnstile-response"]')?.value;
    if (!token) throw new Error("Please complete the captcha.");
    await post("/api/send-otp", { email, captchaToken: token });
    $("sentTo").textContent = email;
    startCooldown();
  }

  $("step1").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = $("e").value.trim(), p = $("p").value, c = $("c").value;
    let ok = true;
    ok = setErr($("e"), $("ee"), /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) ? "" : "Please enter a valid email address.") && ok;
    ok = setErr($("p"), $("ep"), p.length >= 8 ? "" : "Password must be at least 8 characters.") && ok;
    ok = setErr($("c"), $("ec"), c && c === p ? "" : "Passwords do not match.") && ok;
    const hasToken = !!document.querySelector('[name="cf-turnstile-response"]')?.value;
    ok = setErr(null, $("ecap"), hasToken ? "" : "Please complete the captcha.") && ok;
    if (!ok) return;

    $("sendBtn").disabled = true;
    status("Sending code…", true);
    try {
      await sendCode();
      showStep(2);
      status("Code sent. Check your inbox (and spam folder).", true);
      $("otp").focus();
    } catch (err) {
      status(err.message);
      if (window.turnstile) turnstile.reset();
    } finally { $("sendBtn").disabled = false; }
  });

  $("step2").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const otp = $("otp").value.trim();
    if (!setErr($("otp"), $("eo"), /^\d{6}$/.test(otp) ? "" : "Enter the 6-digit code.")) return;

    const email = $("e").value.trim().toLowerCase();
    const password = $("p").value;
    $("verifyBtn").disabled = true;
    status("Verifying…", true);
    try {
      await post("/api/verify-otp", { email, otp, password });
      await signInWithEmailAndPassword(auth, email, password);
      status("Account created! Redirecting…", true);
      setTimeout(() => (location.href = REDIRECT), 800);
    } catch (err) {
      status(err.message);
    } finally { $("verifyBtn").disabled = false; }
  });

  $("resend").addEventListener("click", async () => {
    status("Sending a new code…", true);
    $("resend").disabled = true;
    try {
      // Captcha tokens are single-use, so a resend needs a fresh solve: go back to step 1.
      showStep(1);
      if (window.turnstile) turnstile.reset();
      status("Please solve the captcha again to get a new code.");
    } finally { clearInterval(cooldownTimer); }
  });

  $("back").addEventListener("click", () => {
    clearInterval(cooldownTimer);
    $("otp").value = "";
    showStep(1);
    if (window.turnstile) turnstile.reset();
  });

  $("otp").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); });
</script>
</body>
</html>
