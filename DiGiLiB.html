<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>DiGiLiB | UIU Debate Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#06006f;--amber:#ffb34d;--orange:#ff7a00;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:4px solid var(--navy);box-shadow:0 8px 14px -8px rgba(6,0,111,.3);position:relative;z-index:2}
header img{display:block;height:84px;width:auto}
.logo img{mix-blend-mode:multiply}
.right{display:flex;align-items:center;gap:20px}
.btn{background:var(--orange);color:#fff;border:0;border-radius:6px;padding:10px 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.layout{flex:1;display:grid;grid-template-columns:340px 1fr}
aside{border-right:4px solid var(--navy);padding:28px 18px;background:linear-gradient(90deg,#fff 45%,#e6e6ea);display:flex;flex-direction:column;gap:22px;align-content:start}
.cat{height:86px;border:3px solid var(--amber);border-radius:14px;background:var(--navy);color:#fff;font:600 20px Inter,sans-serif;cursor:pointer;box-shadow:0 10px 18px rgba(0,0,0,.28);transition:transform .15s}
.cat:hover{transform:translateY(-2px)}
.cat[aria-pressed=true]{background:var(--amber);color:var(--navy)}
.cat:focus-visible,.btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
main{padding:40px;min-width:0}
main h2{margin:0 0 20px;font-size:28px;font-weight:600;color:var(--navy)}
.hint{color:var(--muted);font-size:18px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
th{background:var(--navy);color:#fff;text-align:left;padding:14px 16px;font-weight:600}
td{padding:14px 16px;border-top:1px solid var(--line)}
tbody tr:nth-child(even){background:#f7f7fb}
td a{color:var(--orange);font-weight:600}td a:hover{text-decoration:underline}
.soon{color:#9ca3af}
footer{padding:16px 28px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
#gate{position:fixed;inset:0;z-index:99;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:24px}
@media(max-width:800px){header img{height:48px}.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:4px solid var(--navy);display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px;background:#f3f3f6}.cat{height:64px;font-size:16px}main{padding:24px 16px}}
</style></head>

<script>
/* Resource lists live in api/members-data.js (LIBRARY), not in this page. */
window.renderLibrary = function (data) {
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x) e.textContent = x; return e; }
  var nav = document.getElementById('cats'), out = document.getElementById('out');
  function show(c) {
    out.textContent = ''; out.appendChild(el('h2', null, c.label));
    var wrap = el('div', 'tw'), t = el('table'), hr = document.createElement('tr');
    ['Name', 'Upload Date', 'Uploaded by', 'Download'].forEach(function (h) { var th = el('th', null, h); th.scope = 'col'; hr.appendChild(th); });
    var th = document.createElement('thead'); th.appendChild(hr); t.appendChild(th);
    var tb = document.createElement('tbody');
    if (!c.files || !c.files.length) { var r = document.createElement('tr'), td = el('td', 'soon', 'No resources yet.'); td.colSpan = 4; r.appendChild(td); tb.appendChild(r); }
    (c.files || []).forEach(function (f) {
      var r = document.createElement('tr');
      [f.name, f.date, f.by].forEach(function (v) { r.appendChild(el('td', null, v || '')); });
      var d = document.createElement('td');
      if (f.url) { var a = el('a', null, 'Download'); a.href = f.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; d.appendChild(a); }
      else d.appendChild(el('span', 'soon', 'Link coming soon'));
      r.appendChild(d); tb.appendChild(r);
    });
    t.appendChild(tb); wrap.appendChild(t); out.appendChild(wrap);
  }
  (data.categories || []).forEach(function (c) {
    var b = el('button', 'cat', c.label); b.type = 'button'; b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () {
      nav.querySelectorAll('.cat').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true'); show(c);
    });
    nav.appendChild(b);
  });
};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyBWsBJ1Hi9cqE2RMtmEF_NHQVjJktFiii4",
  authDomain: "uiudc-website.firebaseapp.com",
  projectId: "uiudc-website",
  appId: "1:680858269973:web:bc39098d2c9674fd6f911c"
};
const LOGIN = "LogIn.html";
const auth = getAuth(initializeApp(firebaseConfig));
const gate = document.getElementById("gate");
function deny() { gate.innerHTML = '<strong>You do not have access to this page.</strong><a class="btn" href="' + LOGIN + '">Back to log in</a>'; }
document.getElementById("logout").addEventListener("click", async function () { try { await signOut(auth); } finally { location.href = LOGIN; } });
onAuthStateChanged(auth, async function (user) {
  if (!user) { location.replace(LOGIN); return; }
  try {
    const t = await user.getIdToken();
    const r = await fetch("/api/members-data?page=digilib", { headers: { Authorization: "Bearer " + t }, cache: "no-store" });
    if (r.status === 401) { location.replace(LOGIN); return; }
    if (!r.ok) { deny(); return; }
    window.renderLibrary(await r.json());
  } catch (e) { deny(); return; }
  gate.remove();
});
</script>
